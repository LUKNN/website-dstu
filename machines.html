<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление станками</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Управление станками</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="machines.html" class="active">Станки</a></li>
                    <li><a href="repairs.html">Ремонты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Добавить новый станок</h2>
            <form id="machine-form">
                <div class="form-group">
                    <label for="machine-code">Код станка:</label>
                    <input type="text" id="machine-code" name="machine_code" required>
                </div>
                <div class="form-group">
                    <label for="country">Страна производитель:</label>
                    <input type="text" id="country" name="country" required>
                </div>
                <div class="form-group">
                    <label for="year">Год выпуска:</label>
                    <input type="number" id="year" name="year" min="1950" max="2024" required>
                </div>
                <div class="form-group">
                    <label for="brand">Марка:</label>
                    <input type="text" id="brand" name="brand" required>
                </div>
                <button type="submit">Добавить станок</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Список станков</h2>
            <div class="table-container">
                <table id="machines-table">
                    <thead>
                        <tr>
                            <th>Код станка</th>
                            <th>Страна</th>
                            <th>Год выпуска</th>
                            <th>Марка</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="machines-tbody">
                        <!-- Данные будут загружены через JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Система технического обслуживания станков. Учебный проект.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
